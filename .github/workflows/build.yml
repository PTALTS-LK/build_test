# RCT builds

name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: ref
        type: string
        default: main
      target:
        description: target
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
          - android
        default: all
      release:
        description: release
        type: boolean
        default: false
      libusb:
        description: libusb
        type: boolean
        default: true
      prefix:
        description: version prefix
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # 与本地开发环境保持一致；升级 Flutter 时同时检查：
  # - Android 的 Gradle / AGP / KGP / NDK（见 android/ 与下方 android job 的 sdk packages）
  # - Linux 构建依赖（libgtk-3-dev 等，见 linux job 的 deps）
  FLUTTER_VERSION: 3.50.0

jobs:
  linux:
    if: ${{ inputs.target == 'all' || inputs.target == 'linux' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - name: source
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.RCT_SOURCE }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.RCT_TOKEN }}
          persist-credentials: false
          path: src

      - name: deps
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get -qq update
          # libx11-dev / libxi-dev：tray_manager 0.8+ 改基于 nativeapi，Linux 侧需要
          #   GTK3 + X11 + Xi 的开发文件（libayatana-appindicator3-dev 已不再必需）。
          # libgtk-layer-shell 不列在这里：HUD 用 dlopen 运行时加载，构建不需要头文件。
          sudo apt-get -qq install -y --no-install-recommends clang cmake ninja-build \
            pkg-config libgtk-3-dev liblzma-dev libx11-dev libxi-dev libusb-1.0-0

      - name: flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: build
        env:
          RCT_DL_DIRECT: '1'
          RCT_LIBUSB: ${{ inputs.libusb }}
          # 版本前缀（如 IT261115）；留空则 gen_version.dart 用默认 custom。
          # 最终体现在关于页的「构建版本」与构建日志里。
          RCT_VERSION_PREFIX: ${{ inputs.prefix }}
        run: |
          flutter pub get
          ./packaging/build_appimage.sh

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: src/build/RCT-*.AppImage
          if-no-files-found: error

  windows:
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - name: source
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.RCT_SOURCE }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.RCT_TOKEN }}
          persist-credentials: false
          path: src

      - name: flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: build
        # 显式用 bash：Windows runner 默认是 pwsh，跑 .sh 不会同步等完
        # （详见开发备注：步骤显示成功但产物没生成）
        shell: bash
        env:
          RCT_LIBUSB: ${{ inputs.libusb }}
          RCT_VERSION_PREFIX: ${{ inputs.prefix }}
        run: |
          flutter pub get
          ./packaging/build_windows.sh
          test -d build/windows/x64/runner/Release

      - name: pack
        shell: pwsh
        run: |
          $dir = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $dir)) {
            Write-Host "缺少 $dir，实际产物："
            Get-ChildItem -Recurse -Depth 3 build -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "$dir 不存在"
          }
          Compress-Archive -Path "$dir/*" `
            -DestinationPath 'build/RCT-windows-x64.zip' -Force

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: src/build/RCT-windows-x64.zip
          if-no-files-found: error

  macos:
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    runs-on: macos-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: src
    steps:
      - name: source
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.RCT_SOURCE }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.RCT_TOKEN }}
          persist-credentials: false
          path: src

      - name: tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install automake libtool pkg-config > /dev/null

      - name: flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: build
        env:
          RCT_LIBUSB: ${{ inputs.libusb }}
          RCT_VERSION_PREFIX: ${{ inputs.prefix }}
        run: |
          flutter pub get
          ./packaging/build_macos.sh release --dmg

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: src/build/RCT-*.dmg
          if-no-files-found: error

  android:
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: src
    steps:
      - name: source
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.RCT_SOURCE }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.RCT_TOKEN }}
          persist-credentials: false
          path: src

      - name: jdk
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # AGP 9 / Gradle 9 要求 JDK 17+，本地用 21 验证过，CI 保持一致
          java-version: '21'

      - name: sdk
        uses: android-actions/setup-android@v4
        with:
          # ndk 28.2.13676358 是 Flutter 3.50 的硬性要求（各插件都按它编译，
          # 混用 27 会在 stripDebugDebugSymbols 阶段失败）
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - name: flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: false

      - name: build
        env:
          FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
          RCT_VERSION_PREFIX: ${{ inputs.prefix }}
        run: |
          flutter pub get
          ./packaging/build_android.sh release

      - name: pack
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            mv "$f" "RCT-${f#app-}"
          done
          mv app-release.apk RCT-universal.apk

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: src/build/app/outputs/flutter-apk/RCT-*.apk
          if-no-files-found: error

  release:
    if: ${{ inputs.release && success() }}
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-${{ github.run_number }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$TAG"
